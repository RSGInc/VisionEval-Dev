# POPULATIONSIM SETUP CONIGS

# VE-MODEL CONFIGS
MODEL_DIR: models/VERSPM-popsim


# POPULATIONSIM CONFIGS
POPSIM_TEMPLATE_DIR: PopulationSim_Template
POPSIM_RUN_DIR: PopulationSim_Run
POPSIM_OUTPUTS:
    HOUSEHOLD: 
      FILE: output/synthetic_households.csv
      CURRENCY: [HHINCADJ]
    PERSON: 
      FILE: output/synthetic_persons.csv
      CURRENCY: [PINCADJ]

# Optionally use the automated data preparation tool
AUTO_DATA_PREP:
