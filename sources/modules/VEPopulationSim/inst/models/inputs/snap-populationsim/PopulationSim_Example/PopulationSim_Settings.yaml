    ACS_YEAR: 2017
    STATE: OR
    SOURCE_DATA:
      USE: BZONE_LATLON
      CENSUS:
        GEOGRAPHY: 
            FILE: PopulationSim_Sources/tl_2010_41_bg10.zip                  # https://www2.census.gov/geo/tiger/TIGER2010/BG/2010/
        PUMA_XWALK: 
            FILE: PopulationSim_Sources/2010_Census_Tract_to_2010_PUMA.txt
        BZONE_GEOGRAPHY:
            FILE: PopulationSim_Sources/Bzones.zip
            MINAREA: .05
            BZONEID: BzoneID
        ACS_VARS:
            FILE: PopulationSim_Sources/acs_variables.csv
        PUMS_VARS:
            FILE: PopulationSim_Sources/pums_variables.csv
      MODEL:
        BZONE_LATLON:
            FILE: inputs/bzone_lat_lon.csv
